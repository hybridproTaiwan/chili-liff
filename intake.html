<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>馳立汽車｜愛車初診表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#2F4A3A;--green2:#3E5E4B;--cream:#F3EEE5;--card:#FBF8F2;--sage:#E4E7DC;--line:#D9D3C6;--ink:#2B2A26;--muted:#6E6A60;--sun:#E3A46F;--err:#B4432F}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);font-size:20px;line-height:1.55}
.serif{font-family:"Noto Serif TC",serif}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 130px}
.topbar{background:#123339;padding:10px 16px}
.topbar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.topbar img{width:46px;height:46px;border-radius:50%;background:#fff}
.topbar span{color:#C9D3D2;font-family:"Courier New",ui-monospace,monospace;font-size:13px;letter-spacing:.5px;white-space:nowrap}
header{padding:20px 4px 4px}
header h1{margin:0;font-size:32px;color:var(--green)}
header p{margin:6px 0 0;font-size:18px;color:var(--muted)}
.hero{width:100%;height:190px;object-fit:cover;border-radius:16px;margin:4px 0 14px;display:block}
.demo{background:#fff;border:2px dashed var(--sun);border-radius:14px;padding:10px 12px;margin:12px 0 4px;font-size:16px;color:var(--muted)}
.demo b{color:#a15f28}
.demo .row{display:flex;gap:8px;margin-top:8px}
.demo button{flex:1;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.demo button.on{background:var(--green);color:#fff;border-color:var(--green)}
.progress{margin:18px 0 6px;font-size:17px;color:var(--muted);text-align:center}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar div{height:100%;background:var(--green);transition:width .3s}
.card{background:var(--card);border-radius:22px;padding:20px 18px;margin-top:14px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card.dark{background:var(--green);color:#fff}
.card.dark h2,.card.dark .sub{color:#fff}
h2{font-family:"Noto Serif TC",serif;font-size:26px;margin:0 0 6px;color:var(--green)}
.sub{font-size:17px;color:var(--muted);margin:0 0 6px}
.q{margin-top:24px}
.q>.lab{display:block;font-weight:700;font-size:21px;margin-bottom:8px}
.q .hint{font-size:16px;color:var(--muted);margin:-4px 0 8px}
.opt{font-weight:400;font-size:16px;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;font-size:21px;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-family:inherit}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);background-position:calc(100% - 22px) 26px,calc(100% - 14px) 26px;background-size:8px 8px;background-repeat:no-repeat;padding-right:40px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips.one{grid-template-columns:1fr}
.chip{font-size:20px;font-weight:700;padding:16px 10px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--green);text-align:center;cursor:pointer;font-family:inherit;line-height:1.3}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.big{display:block;width:100%;font-size:23px;font-weight:700;padding:20px 18px;border-radius:18px;border:none;margin-top:14px;cursor:pointer;font-family:"Noto Serif TC",serif;text-align:left}
.big small{display:block;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;font-size:17px;font-weight:400;opacity:.85;margin-top:4px}
.b1{background:var(--green);color:#fff}.b2{background:var(--sage);color:var(--green)}
.err{color:var(--err);font-size:17px;margin-top:6px;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.nav button{flex:1;font-size:22px;font-weight:700;padding:16px;border-radius:16px;border:none;font-family:inherit;cursor:pointer}
.back{background:var(--sage);color:var(--green);flex:0 0 32% !important}
.next{background:var(--green);color:#fff}
.sum{background:#fff;border-radius:14px;padding:12px 14px;font-size:18px;margin-top:10px;border:1px solid var(--line)}
.sum div{padding:3px 0}
.sum b{color:var(--green)}
.sum h3{margin:6px 0 4px;font-size:18px;color:var(--muted);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:10px}
.safe{background:var(--sage);color:var(--green);border-radius:12px;padding:10px 12px;font-size:16px;margin-top:10px}
.hol img{width:100%;border-radius:14px;margin-top:10px}
.official{background:#E9EFEA;border:1px solid #C9D6CC;margin-top:40px;font-size:17px;line-height:1.7;color:#3E5E4B}
.official h2{color:#3E5E4B}
.official b{font-size:18px}
.official .links a{background:#D7E2DA;color:#3E5E4B;text-decoration:none;padding:6px 12px;border-radius:999px}
.talk{display:block;text-align:center;margin-top:14px;padding:14px;border-radius:14px;background:var(--green);color:#fff;text-decoration:none;font-size:20px;font-weight:700}
.offbtn{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:12px;border:1px solid #C9D6CC;color:#4E6B58;text-decoration:none;font-size:17px;background:#F5F8F5}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{font-size:15px}
.notice{background:#FFF6EC;border:2px solid var(--sun);border-radius:14px;padding:12px 14px;font-size:18px;margin-top:10px}
.notice b{color:#a15f28}
.backlink{display:block;width:100%;margin-top:12px;padding:14px;border-radius:14px;border:none;background:transparent;color:var(--green);font-size:19px;font-weight:700;font-family:inherit;cursor:pointer}
.quote{font-family:"Noto Serif TC",serif;text-align:center;color:var(--green);font-size:19px;margin:22px 8px 0}
</style>

function pCustomer(){const pre=S.branch!=='new';return `<div class="card"><h2>客戶資料</h2>${pre?'<p class="sub">這是您之前留的資料，有變動直接改就好。</p>':''}
 ${Q('姓名',txt('name','請填全名，方便建立您的保養紀錄'),'name')}
 ${S.d.lineName?`<p class="sub" style="margin-top:10px">LINE：${esc(S.d.lineName)}（已自動帶入）</p>`:''}
 ${Q('手機',txt('phone','09xxxxxxxx','tel'),'phone')}
 ${Q('居住縣市',sel('county',COUNTIES),'county')}
 ${S.branch==='new'&&!S.d.cameBefore?Q('從哪裡知道馳立',chips('source',SOURCES,true)+((S.d.source||[]).includes('其他')?'<div style="margin-top:10px">'+txt('sourceOther','請寫下來')+'</div>':''),'source',false,'可以選很多個'):''}</div>`}

function modelList(){const b=S.d.brand,p=S.d.power;if(!MODELS[b])return [];if(p==='不確定'||!p)return [].concat(MODELS[b]['油電'],MODELS[b]['插電'],MODELS[b]['汽油']);return MODELS[b][p]||[]}
function pVehicle(){const b=S.d.brand,m=S.d.model;return `<div class="card"><h2>愛車資料</h2>
 ${Q('車牌',txt('plate','例：ABC-1234、AB-1234、TAA-123'),'plate',false,'英文和數字照車牌上的順序填，分隔線可以不打')}${S.err.plate?chips('plateOdd',['我的車牌是其他格式'],false,'one'):''}
 ${Q('品牌',chips('brand',['Toyota','Lexus','其他']),'brand')}
 ${b==='其他'?Q('品牌與車款',txt('brandOther','例：Honda CR-V'),'brandOther'):''}
 ${b&&b!=='其他'?Q('動力',chips('power',['油電','汽油','插電','不確定']),'power'):''}
 ${b&&b!=='其他'&&S.d.power?Q('車款',sel('model',modelList().concat(['其他（自己填）'])),'model'):''}
 ${m==='其他（自己填）'?Q('車款名稱',txt('modelOther','請寫下車款'),'modelOther'):''}
 ${DRIVE.includes(m)?Q('驅動方式',chips('drive',['2WD','4WD','不確定']),'drive'):''}
 ${Q('年份',sel('year',YEARS),'year')}
 ${Q('目前里程',sel('km',KM),'km',false,'大概的數字就好')}
 ${Q('一手還是二手',chips('hand',['一手','二手']),'hand')}
 ${S.d.hand==='二手'?Q('大約幾萬公里接手',sel('handKm',KM),'handKm'):''}</div>`}

function pHistory(){const hv=['油電','插電'].includes(S.d.power);const upd=S.branch==='update';return `<div class="card"><h2>保養歷程</h2><p class="sub">就像看醫生時的過去病史，記得多少填多少，不記得就選「不記得」。</p>
 ${upd?Q('目前里程',sel('km',KM),'km'):''}
 ${Q('有原廠 App 截圖或保養單嗎',`<input type="file" accept="image/*" multiple data-file="1" style="font-size:18px"><div class="thumbs" id="thumbs">${(S.d.photos||[]).map(u=>`<img src="${u}">`).join('')}</div><div class="safe">🔒 照片用來了解愛車保養歷程，僅馳立看到，不會外流。</div>`,'photos',true,'拍照上傳，下面記不得的就直接選「不記得」')}
 ${hv?Q('動力電池（大電池）',chips('battery',['沒換過','原廠換的','外廠換的','不記得']),'battery'):''}
 ${hv&&['原廠換的','外廠換的'].includes(S.d.battery)?Q('大約幾萬公里換的',sel('batteryKm',KM),'batteryKm'):''}
 ${Q('輔助電瓶（小電瓶）最近一次換',chips('aux',['1 年內','1–2 年','2–3 年','3 年以上','沒換過','不記得']),'aux')}
 ${Q('平常在哪換機油',chips('oilWhere',['原廠','外廠','都有']),'oilWhere')}
 ${Q('用哪一種機油',txt('oilType','例：0W-20、原廠機油'),'oilType',true)}
 ${Q('變速箱油最近一次',sel('gear',CHANGED),'gear')}
 ${Q('剎車油最近一次',sel('brake',CHANGED),'brake')}
 ${Q('火星塞最近一次',sel('plug',CHANGED),'plug')}
 ${Q('剎車皮',chips('pads',['全車換過','全車沒換過','只換過前剎車皮','只換過後剎車皮','不記得'],false,'one'),'pads')}
 ${['全車換過','只換過前剎車皮','只換過後剎車皮'].includes(S.d.pads)?Q('剎車皮大約幾萬公里換的',sel('padsKm',KM),'padsKm'):''}
 ${Q('開一萬公里大約要多久',chips('tenk',['3 個月內','4–6 個月','7–12 個月','1 年以上','不確定']),'tenk',false,'用車習慣有變的話，這裡更新一下')}</div>`}

function pPick(){const c=ME.cars.find(x=>x.plate===S.d.pickPlate),m=ME.customer||{};return `<div class="card"><h2>要更新哪台車</h2>
 ${Q('選擇車牌',chips('pickPlate',ME.cars.map(x=>x.plate)),'pickPlate')}
 ${c?`<div class="sum"><div><b>${esc(m.name)}</b>｜${esc(m.phone)}｜${esc(m.county)}</div><div>${esc(c.brand)} ${esc(c.model)}${c.year?'｜'+esc(c.year)+' 年':''}</div></div>`:''}
 ${c?Q('哪些要更新',chips('upd',['客戶資料','這台車的保養歷程'],true,'one'),'upd',false,'可以兩個都選；沒選的就維持原本的資料'):''}</div>`}

function pConfirm(){return `<div class="card"><h2>確認資料</h2>
 <div class="sum"><div><b>${esc(S.d.name)}</b></div><div>${esc(S.d.phone)}｜${esc(S.d.county)}</div></div>
 ${Q('資料有變動嗎',chips('changed',['沒有','有，我要修改']),'changed')}
 ${Q('這次要預約哪台車',chips('pickPlate',ME.cars.map(x=>x.plate+(x.model?'｜'+x.model:'')).concat(['別台車（這次帶新的車來）']),false,'one'),'pickPlate')}${S.d.pickPlate==='別台車（這次帶新的車來）'?'<p class="sub" style="margin-top:10px">按「下一步」後，請先填新車的資料，再選預約時間。</p>':''}</div>`}

function pBooking(){const ask=S.branch!=='book';const yes=S.d.wantBook==='要預約';const today=new Date().toISOString().slice(0,10);return `<div class="card hol"><h2>放假公告</h2><p class="sub">來店前請先看一下公休日</p>${holidayImgs()}</div>
 <div class="card"><h2>預約</h2>
 ${ask?Q('要順便預約入廠嗎',chips('wantBook',['要預約','先不用']),'wantBook'):''}
 ${yes?Q('想處理的項目',chips('items',ITEMS,true)+itemNotes(),'items',false,'可以選很多個；選了之後下面可以多說明'):''}
 ${yes?Q('方便的星期',chips('days',['週一','週二','週三','週四','週五','週六'],true),'days',false,'可以選很多天；週日公休'):''}
 ${yes?Q('方便的時段',chips('slots',['上午 10–12','下午 1–3','下午 3–5','下午 5–7'],true),'slots',false,'可以選很多個'):''}
 ${yes?Q('有指定的日期嗎',`<input type="date" data-k="date" min="${today}" value="${esc(S.d.date||'')}">`,'date',true,'沒有就不用填，小編會依上面的時間跟您約'):''}
 </div>`}
// 同一台車已有待確認預約（r22）：讓客人自己選要修改還是另外再約
function pendingOf(){const c=(ME.cars||[]).find(x=>x.plate===S.d.plate);return c&&c.pendingBooking}
function whenOf(id){const m=String(id||'').match(/^\d{2}(\d{2})(\d{2})-(\d{2})(\d{2})/);return m?(+m[1])+'/'+(+m[2])+' '+m[3]+':'+m[4]:''}
function dupBox(){const p=pendingOf();if(!p||S.d.wantBook!=='要預約')return '';
 return `<div class="card"><h2>上次的預約還在等確認</h2><p class="sub">這台車已經有一筆預約，小編還沒跟您確認時間：</p>
 <div class="notice"><div><b>送出時間</b>：${esc(whenOf(p.id))}</div><div><b>想處理</b>：${esc(p.items)}</div>${p.days||p.slots?`<div><b>方便的時間</b>：${esc([p.days,p.slots].filter(Boolean).join(' '))}</div>`:''}${p.date?`<div><b>指定日期</b>：${esc(p.date)}</div>`:''}</div>
 ${Q('這次是要',chips('bookMode',['修改這筆預約','另外再約一次'],false,'one'),'bookMode',false,'改時間或加項目請選「修改」；這是另一次入廠請選「另外再約」')}</div>`}

const ITEM_PH={'定期保養':'例：上次在哪裡保養、想順便檢查什麼','亮故障燈':'哪一顆燈亮？什麼時候開始的？有照片可以傳到 LINE','動力電池':'例：油耗變差、充電怪怪的、電池風扇很大聲','剎車系統':'例：踩起來空空的、有異音','冷氣':'例：冷氣不冷、忽冷忽熱、有味道','全車檢測':'例：剛買二手車想全面檢查','異音異狀':'什麼時候會出現？哪個位置？','其他':'請寫下來'};
function itemNotes(){return (S.d.items||[]).map(it=>`<div style="margin-top:12px"><div class="hint" style="margin:0 0 4px;font-weight:700;color:var(--green)">${esc(it)}<span class="opt">（選填）</span></div><textarea rows="2" data-k="note_${esc(it)}" placeholder="${esc(ITEM_PH[it]||'')}">${esc(S.d['note_'+it]||'')}</textarea></div>`).join('')}
function pReview(){const d=S.d;const R=(k,v)=>(v&&(!Array.isArray(v)||v.length))?`<div><b>${k}</b>：${esc(Array.isArray(v)?v.join('、'):v)}</div>`:'';
 const car=d.brand==='其他'?d.brandOther:[d.brand,d.power,d.model==='其他（自己填）'?d.modelOther:d.model,d.drive].filter(Boolean).join(' ');
 const hist=[R('動力電池',d.battery&&(d.battery+(d.batteryKm?'，約 '+d.batteryKm:''))),R('輔助電瓶',d.aux),R('機油',d.oilWhere&&(d.oilWhere+(d.oilType?'，'+d.oilType:''))),R('變速箱油',d.gear),R('剎車油',d.brake),R('火星塞',d.plug),R('剎車皮',d.pads&&(d.pads+(d.padsKm?'，約 '+d.padsKm:''))),R('開一萬公里',d.tenk),(d.photos||[]).length?`<div><b>上傳圖片</b>：${d.photos.length} 張</div>`:''].join('');
 return `<div class="card"><h2>確認一下</h2><p class="sub">請看看有沒有填錯，沒問題就按「送出」。</p>
 <div class="sum"><h3>客戶</h3>${R('姓名',d.name)}${R('LINE 名稱',d.lineName)}${R('手機',d.phone)}${R('縣市',d.county)}
 ${car||d.plate?`<h3>愛車</h3>${R('車牌',d.plate||(d.pickPlate||'').split('｜')[0])}${R('車款',car)}${R('年份',d.year)}${R('目前里程',d.km)}`:''}
 ${hist&&S.branch!=='book'?`<h3>保養歷程</h3>${hist}`:''}
 ${d.wantBook==='要預約'?`<h3>預約</h3>${R('想處理',d.items)}${(d.items||[]).map(it=>R(it+' 說明',d['note_'+it])).join('')}${R('方便的星期',d.days)}${R('方便的時段',d.slots)}${R('指定日期',d.date)}`:''}</div>
 <p class="quote">🔎 每一筆紀錄，都是您愛車健康的一部分。</p></div>`}

function pDone(){const book=S.d.wantBook==='要預約';return `<div class="card" style="text-align:center"><h2>已收到，謝謝您 🌿</h2>
 <p>${book?'小編會盡快在 LINE 上跟您確認入廠時間。':'您的愛車資料已經建立，需要時隨時在 LINE 找我們。'}</p>
 </div>
 ${official()}
 ${window.liff&&liff.isInClient&&liff.isInClient()?'<button class="big b2" id="closeWin" style="text-align:center">關閉</button>':''}`}

// ===== 驗證 =====
function check(step){const d=S.d,e={};
 if(step==='customer'){if(!d.name)e.name='請填寫姓名';if(!/^09\d{8}$/.test(d.phone||''))e.phone='手機號碼要完整填寫：09 開頭，共 10 碼';if(!d.county)e.county='請選擇縣市'}
 if(step==='vehicle'){if(!d.plate)e.plate='請填寫車牌';else{d.plate=fmtPlate(d.plate);if(!PLATE_RE.some(r=>r.test(d.plate))&&d.plateOdd!=='我的車牌是其他格式')e.plate='車牌格式看起來不太對，請再確認一下（例：ABC-1234、AB-1234、A1-2345、1234-AB、計程車 TAA-123）'}if(!d.brand)e.brand='請選擇品牌';if(d.brand==='其他'&&!d.brandOther)e.brandOther='請寫下品牌與車款';if(d.brand&&d.brand!=='其他'){if(!d.power)e.power='請選擇動力';else if(!d.model)e.model='請選擇車款'}if(!d.year)e.year='請選擇年份';if(!d.km)e.km='請選擇目前里程';if(!d.hand)e.hand='請選一手或二手'}
 if(step==='pick'){if(!d.pickPlate)e.pickPlate='請選擇車牌';else if(!(d.upd||[]).length)e.upd='請至少選一項'}
 if(step==='confirm'){if(!d.changed)e.changed='請選一個';if(!d.pickPlate)e.pickPlate='請選擇車牌'}
 if(step==='booking'){if(S.branch!=='book'&&!d.wantBook)e.wantBook='請選一個';if(d.wantBook==='要預約'){if(!(d.items||[]).length)e.items='請至少選一項';if(!(d.days||[]).length&&!d.date)e.days='請選方便的星期，或填指定日期';if(d.date&&new Date(d.date).getDay()===0)e.date='週日公休，請選別天';if(pendingOf()&&!d.bookMode)e.bookMode='請選一個'}}
 S.err=e;return !Object.keys(e).length}

// ===== 畫面 =====
function render(){
 const app=$('#app'),nav=$('#nav');
 if(!S.branch){app.innerHTML=pHome();nav.style.display='none';return}
 if(S.i>=S.steps.length){app.innerHTML=pDone();nav.style.display='none';return}
 const st=S.steps[S.i];const f={customer:pCustomer,vehicle:pVehicle,history:pHistory,pick:pPick,confirm:pConfirm,booking:()=>pBooking()+dupBox(),review:()=>pReview()+(S.msg?`<div class="notice"><b>${esc(S.msg)}</b></div>`:'')}[st];
 app.innerHTML=`<div class="progress">第 ${S.i+1} 步／共 ${S.steps.length} 步｜${TITLES[st]}</div><div class="bar"><div style="width:${(S.i+1)/S.steps.length*100}%"></div></div>`+f();
 nav.style.display='block';const nb=$('#btnNext');nb.textContent=st==='review'?(S.sending?'送出中…':'送出'):'下一步';nb.disabled=S.sending;$('#btnBack').disabled=S.sending}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.branch){
  // 選「第一次來」但其實找得到資料：直接帶到老客首頁
  if(t.dataset.branch==='new'&&S.who==='ready'&&LOOK==='done'&&ME.isReturning){S.who='old';render();scrollTo(0,0);return}
  start(t.dataset.branch);return}
 if(t.id==='toReady'){S.who='ready';render();scrollTo(0,0);return}
 if(t.id==='iamold'){S.who=LOOK==='pending'?'waiting':(ME.isReturning?'old':'notfound');render();scrollTo(0,0);return}
 if(t.id==='retry'){location.reload();return}
 if(t.id==='closeWin'){liff.closeWindow();return}
 if(t.dataset.k){const k=t.dataset.k,v=t.dataset.v;if(t.dataset.m==='1'){const a=S.d[k]||[];S.d[k]=a.includes(v)?a.filter(x=>x!==v):a.concat(v)}else S.d[k]=v;
  if(k==='brand'){delete S.d.power;delete S.d.model;delete S.d.drive}if(k==='power'){delete S.d.model;delete S.d.drive}
  if(k==='pickPlate'){const c=ME.cars.find(x=>v===x.plate||v.startsWith(x.plate+'｜'));if(c){const {plate,brand,power,model,drive,year}=c;Object.assign(S.d,{plate,brand,power,model,drive,year:year?String(year):'',pickPlate:v});delete S.d.bookMode}}
  delete S.err[k];render();return}});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k&&e.target.tagName!=='SELECT'){if(k==='phone'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,10)}S.d[k]=e.target.value.trim()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.file){[...t.files].slice(0,5).forEach(f=>shrink(f).then(u=>{S.d.photos=(S.d.photos||[]).concat(u).slice(0,5);$('#thumbs').innerHTML=S.d.photos.map(u=>`<img src="${u}">`).join('')}));return}
 const k=t.dataset.k;if(!k)return;S.d[k]=t.value;if(t.tagName==='SELECT'||t.type==='date'){delete S.err[k];render()}});
$('#btnNext').onclick=()=>{const st=S.steps[S.i];if(st==='review'){submit();return}if(!check(st)){render();const er=document.querySelector('.err');if(er)er.scrollIntoView({behavior:'smooth',block:'center'});return}
 if(st==='confirm'&&S.d.pickPlate==='別台車（這次帶新的車來）'){const keep={name:S.d.name,phone:S.d.phone,lineName:ME.lineName,county:S.d.county};S.branch='car';S.d=Object.assign({wantBook:'要預約'},keep);buildSteps();S.i=S.steps.indexOf('vehicle');render();scrollTo(0,0);return}
 buildSteps();S.i=S.steps.indexOf(st)+1;render();scrollTo(0,0)};
$('#btnBack').onclick=()=>{if(S.sending)return;S.err={};S.msg='';if(S.i===0){S.branch=null}else S.i--;render();scrollTo(0,0)};
// ===== 照片縮小（長邊 1600px、JPEG），送出比較快 =====
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const M=1600,sc=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8))};img.onerror=()=>res(r.result);img.src=r.result};r.readAsDataURL(file)})}

// ===== 和 B1 接收端連線 =====
// 用 text/plain 送 JSON，瀏覽器不會先發預檢請求
async function callB1(payload){const r=await fetch(CONFIG.B1_URL,{method:'POST',body:JSON.stringify(payload)});return r.json()}
const nos=v=>String(v==null?'':v).replace(/\s+/g,'');
const BATTERY={'原廠換的':'原廠換','外廠換的':'外廠換'};
function toBody(){const d=S.d,br=S.branch,other=d.brand==='其他',selfModel=d.model==='其他（自己填）';
 const withHistory=br==='new'||br==='car'||(br==='update'&&(d.upd||[]).includes('這台車的保養歷程'));
 const notes={};(d.items||[]).forEach(it=>{if(d['note_'+it])notes[it]=d['note_'+it]});
 return {action:'submit',idToken:ID_TOKEN,nonce:NONCE,branch:br,formVersion:CONFIG.VERSION,selfReturning:!!d.cameBefore,
  customer:{name:d.name,phone:d.phone,county:d.county,sources:br==='new'?(d.source||[]).map(x=>x==='其他'&&d.sourceOther?'其他：'+d.sourceOther:nos(x)):[]},
  vehicle:{plate:d.plate||(d.pickPlate||'').split('｜')[0],brand:d.brand,power:d.power,
   model:other?d.brandOther:(selfModel?d.modelOther:d.model),modelOther:other?d.brandOther:(selfModel?d.modelOther:''),
   drive:d.drive,year:d.year,km:nos(d.km),hand:d.hand,handKm:nos(d.handKm)},
  history:withHistory?{battery:BATTERY[d.battery]||d.battery,batteryKm:nos(d.batteryKm),aux:nos(d.aux),oilPlace:d.oilWhere,oilType:d.oilType,
   gear:nos(d.gear),brakeFluid:nos(d.brake),plug:nos(d.plug),pads:d.pads,padsKm:nos(d.padsKm),tenk:nos(d.tenk)}:undefined,
  booking:{want:d.wantBook==='要預約',items:d.items||[],notes,days:d.days||[],slots:(d.slots||[]).map(nos),date:d.date||'',
   mode:d.bookMode==='修改這筆預約'?'modify':(d.bookMode?'new':undefined)},
  photos:(d.photos||[]).map(u=>({data:String(u).split(',')[1],mime:'image/jpeg'}))}}

// LINE 身分憑證約一小時過期：快過期就先存草稿、重新整理換新的
function tokenExpiring(){try{const t=liff.getDecodedIDToken();return t&&t.exp*1000<Date.now()+120000}catch(e){return false}}
function saveDraft(){try{sessionStorage.setItem('chiliDraft',JSON.stringify({branch:S.branch,steps:S.steps,i:S.i,d:S.d}))}catch(e){try{const d=Object.assign({},S.d);delete d.photos;sessionStorage.setItem('chiliDraft',JSON.stringify({branch:S.branch,steps:S.steps,i:S.i,d}))}catch(e2){}}}
function loadDraft(){try{const x=JSON.parse(sessionStorage.getItem('chiliDraft')||'null');sessionStorage.removeItem('chiliDraft');if(x&&x.branch){S.branch=x.branch;S.steps=x.steps;S.i=x.i;S.d=x.d}}catch(e){}}

async function submit(){if(S.sending)return;
 if(tokenExpiring()){saveDraft();location.reload();return}
 S.sending=true;S.msg='';render();
 try{const r=await callB1(toBody());
  if(r&&r.ok){S.sending=false;S.i=S.steps.length;render();scrollTo(0,0);return}
  S.msg=r&&r.error==='busy'?'現在有點忙，請再按一次「送出」。':'送出沒有成功，請再按一次「送出」；還是不行，請直接在 LINE 告訴我們。'}
 catch(e){S.msg='網路好像不太穩，請再按一次「送出」。'}
 S.sending=false;render();const n=document.querySelector('.notice');if(n)n.scrollIntoView({behavior:'smooth',block:'center'})}

// ===== 打開表單：LINE 登入 → 先讓客人自己選，背景再問 B1 是新客還是老客 =====
async function init(){render();
 try{
  if(!window.liff)throw new Error('LINE 元件沒有載入');
  await liff.init({liffId:CONFIG.LIFF_ID,withLoginOnExternalBrowser:true});
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
  ID_TOKEN=liff.getIDToken();
 }catch(e){console.error(e);S.who='error';S.msg='LINE 連線沒有成功，請重新整理一次。（'+(e&&e.message||e)+'）';render();return}
 S.who='ready';render();
 lookup();}
async function lookup(){
 try{const r=await callB1({action:'lookup',idToken:ID_TOKEN});
  if(!r||!r.ok)throw new Error(r&&r.error||'lookup_failed');
  ME={lineName:r.lineName||'',customer:r.customer||null,cars:r.cars||[],isReturning:!!r.isReturning};LOOK='done';
  const c0=ME.customer||{};callB1({action:'opened',idToken:ID_TOKEN,isReturning:ME.isReturning,name:c0.name||'',phone:c0.phone||'',plate:ME.cars.map(x=>x.plate).join('、')}).catch(()=>{});
 }catch(e){console.error(e);LOOK='failed';try{const p=liff.getDecodedIDToken();ME.lineName=p&&p.name||''}catch(e2){}}
 // 客人已經按了「我來過」在等：查完就帶過去
 if(S.who==='waiting'){S.who=ME.isReturning?'old':'notfound';render()}
 loadDraft();if(S.branch)render()}
init();
</script>
</body>
</html>
